name: test github actions
# Schedule to run the action every 5 minutes
on:
  schedule:
    - cron: "*/15 * * * *" # Run every 15 minutes
# on: [push]

jobs:
  write-time-job:
    runs-on: ubuntu-latest # Use the latest Ubuntu environment

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3 # Checkout the repository code

      - name: Set up Python
        uses: actions/setup-python@v4 # Set up Python environment
        with:
          python-version: "3.10" # You can choose the Python version

      - name: install python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python script
        run: python test/write_time.py # Run the Python script that writes the current time

      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add test/current_time.txt
          git commit -m "Update current_time.txt with latest time"
          git push
